[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "heisenberg-toolkit"
version = "0.1.0"
description = "Heisenberg: sbom + deps.dev health checks"
requires-python = ">=3.11.9"
dependencies = [
    "requests>=2.32.5",
    "defusedxml>=0.7.1",
    "PyYAML>=6.0.3",
]

[project.scripts]
heisenberg = "heisenberg.main:cli"

[tool.setuptools.packages.find]
include = ["heisenberg*"]    
exclude = ["img*", "tests*", "docs*"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live'"
markers = [
    "live: end-to-end tests that call real external APIs (deps.dev, PyPI, npm, crates.io). Run with: pytest -m live",
]
